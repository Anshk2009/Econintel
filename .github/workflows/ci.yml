name: Post-push debug

# Runs on every push and every pull request against main.
# Catches syntax errors, leaked secrets, and missing env vars BEFORE
# a broken function reaches production.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Least privilege for the job token (audit SEC-16): nothing here writes to the
# repo, and the jobs that hold secrets must not also hold a write token.
permissions:
  contents: read

jobs:
  debug:
    name: Lint · Secret-scan · Config check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # ── 1. Syntax check: every .js/.mjs file must parse without errors ──────
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Syntax-check edge functions
        run: |
          echo "=== Syntax check: functions/ ==="
          # These are .js files containing ESM `import`. On Node 22, `node --check`
          # treats .js as CommonJS unless a package.json says "type":"module" — and
          # that manifest is deliberately NOT in the repo root any more (it was
          # being served publicly). Copying to .mjs makes the check depend only on
          # the file itself, on any Node version.
          mkdir -p /tmp/synt
          for f in functions/*.js; do
            cp "$f" "/tmp/synt/$(basename "$f" .js).mjs"
            node --check "/tmp/synt/$(basename "$f" .js).mjs" && echo "  ✅ $f" || (echo "  ❌ $f — syntax error" && exit 1)
          done

      - name: Syntax-check RAG scripts
        run: |
          echo "=== Syntax check: .rag/ ==="
          for f in .rag/*.mjs .rag/sources/*.mjs; do
            [ -f "$f" ] || continue
            node --check "$f" && echo "  ✅ $f" || (echo "  ❌ $f — syntax error" && exit 1)
          done

      # ── 1b. Self-checks ─────────────────────────────────────────────────────
      #    Two pieces of logic that syntax-checking cannot vouch for and that have
      #    both already caused a production failure: the SSE framing of the
      #    retrieval-failure notice, and the embedding request budget. No network,
      #    no secrets, no framework — plain node + assert, so they cost nothing.
      - name: Run self-checks
        run: |
          echo "=== Self-checks ==="
          for t in .scripts/test-*.mjs; do
            [ -f "$t" ] || continue
            node "$t" || (echo "  ❌ $t failed" && exit 1)
          done

      # ── 2. (removed) Dependency audit ───────────────────────────────────────
      # There is nothing to audit: this project has zero runtime dependencies and
      # no lockfile, and the manifest that used to gate these steps now lives at
      # .package.json (outside EdgeOne's public serving path). `npm audit` over a
      # dependency-free manifest only ever reported "found 0 vulnerabilities".

      # ── 3. Hardcoded secret / credential scan ───────────────────────────────
      #    Every tracked file, against the shapes of the keys this project
      #    actually holds (NVIDIA, Supabase sb_secret_ / JWT, Google OAuth,
      #    Resend, GitHub, AWS, private keys). Replaced three grep lines that
      #    only knew an OpenRouter key and a JWT header (audit SEC-16).
      #    The patterns are self-tested in .scripts/test-secret-scan.mjs.
      - name: Check for hardcoded secrets
        run: node .scripts/check-secrets.mjs

      # ── 4. Env-var coverage check ────────────────────────────────────────────
      #    Every env var used in code should be listed in .env.example.
      - name: Env-var coverage
        run: |
          echo "=== Env-var coverage ==="
          MISSING=()
          for VAR in JWT_SECRET ALLOWED_ORIGIN SUPABASE_URL SUPABASE_ANON_KEY \
                     NVIDIA_API_KEY \
                     SUPABASE_SECRET_KEY SUPABASE_SERVICE_ROLE_KEY \
                     DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET \
                     GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                     RESEND_API_KEY FRED_API_KEY DATA_GOV_IN_KEY INGEST_CONTACT; do
            if ! grep -q "$VAR" .env.example 2>/dev/null; then
              MISSING+=("$VAR")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "⚠️  These env vars are used in code but missing from .env.example:"
            for v in "${MISSING[@]}"; do echo "   $v"; done
            # Warn only — .env.example is documentation, not enforcement
          else
            echo "  ✅ All expected env vars documented in .env.example"
          fi

      # ── 5. Workflow file validation (yamllint) ───────────────────────────────
      - name: Validate GitHub Actions YAML
        run: |
          pip install yamllint==1.35.1 --quiet
          yamllint -d relaxed .github/workflows/ && echo "  ✅ Workflow YAML valid"

      # ── 6. RLS reminder ──────────────────────────────────────────────────────
      #    Flags if the rollback migration (disable RLS) is the most recent one.
      #    Means RLS may be OFF in production — a known critical finding.
      - name: RLS posture check
        run: |
          echo "=== RLS posture ==="
          LAST=$(ls .migrations/*.sql 2>/dev/null | sort | tail -1)
          if echo "$LAST" | grep -q "rollback_disable_rls\|disable_rls"; then
            echo "⚠️  WARNING: latest migration appears to DISABLE RLS ($LAST)."
            echo "   Run .migrations/0003_enable_rls.sql — the functions use SUPABASE_SECRET_KEY, which bypasses RLS."
          else
            echo "  ℹ️  Latest migration: $LAST"
          fi

      - name: Summary
        if: always()
        run: |
          echo ""
          echo "=============================="
          echo "  EconIntel post-push debug done"
          echo "=============================="
