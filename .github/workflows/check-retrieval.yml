name: Check retrieval quality

# The signal that was missing when four retrieval defects shipped unnoticed.
# Weekly + on any change to the RAG pipeline, because that is when ranking,
# chunking or the embedding model can silently stop working. NOT on every ingest:
# each run spends one embedding request on the same capped free key the live chat
# uses, and starving the chat is the failure this whole effort exists to prevent.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 5 * * 1"        # Mondays 05:17 UTC (off the hour: top-of-hour runs get dropped under load)
  push:
    branches: [main]
    paths:
      - '.rag/schema.sql'
      - '.rag/golden.json'
      - '.rag/check-retrieval.mjs'
      - '.rag/sources/_lib.mjs'
      - '.rag/ingest-files.mjs'

# Least privilege for the job token (audit SEC-16): nothing here writes to the
# repo, and the jobs that hold secrets must not also hold a write token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Ask the library the questions it exists to answer
        working-directory: .rag
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node check-retrieval.mjs
