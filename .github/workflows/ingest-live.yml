name: RAG live news ingest

# Keeps the EconIntel knowledge base current by running the live RSS ingester
# on a schedule. It calls OpenRouter (embeddings) + Supabase using repo secrets —
# no website files are touched, so this never affects the live site.

on:
  schedule:
    # Every 3 hours at :27 past — deliberately NOT on the hour. GitHub heavily
    # delays or DROPS scheduled runs queued at the top of the hour (:00) because
    # that is its busiest slot, so an off-peak minute is far more reliable.
    # Times are UTC; GitHub may still start a run a few minutes late.
    - cron: "27 */3 * * *"
  workflow_dispatch: {}      # also adds a "Run workflow" button in the Actions tab
                            # so you can trigger it manually to test.

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Safety net: a healthy run finishes in 1-3 min. If anything wedges, kill the
    # whole job at 15 min instead of letting it hang for GitHub's default 6 HOURS
    # (the "stuck" run). The per-request timeouts in ingest-live.mjs are the real
    # fix; this is the backstop.
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"   # Node 20 has fetch() built in — no npm install needed

      - name: Run live ingester
        working-directory: .rag    # ingest-live.mjs reads ./feeds.json from this folder
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Optional: when set, the ingesters authenticate as service_role and
          # RLS on `documents` can stay ON (see .rag/harden-rls.sql). Unset is
          # fine — sources/_lib.mjs falls back to the anon key.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node ingest-live.mjs
