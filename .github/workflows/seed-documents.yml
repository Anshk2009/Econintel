name: Seed documents

# Manually-triggered: embeds every file in .rag/documents/ into Supabase.
# Run this from the Actions tab whenever you add or change docs in .rag/documents/.
# (Separate from the live-news cron so your case studies aren't re-embedded every 3h.)

on:
  workflow_dispatch: {}
  # Also run automatically when the things that INVALIDATE the stored vectors
  # change. Manual-dispatch-only is how the case studies ended up stranded in a
  # dead embedding space for a month: the model name in sources/_lib.mjs changed
  # and nothing re-embedded them. Upserts are on source_url with
  # merge-duplicates, so an extra run is idempotent — it just rewrites the same
  # rows. Cheap insurance against a one-line edit silently killing retrieval.
  push:
    branches: [main]
    paths:
      - '.rag/documents/**'
      - '.rag/sources/_lib.mjs'
      - '.rag/ingest-files.mjs'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run file ingester
        working-directory: .rag
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Optional: when set, the ingesters authenticate as service_role and
          # RLS on `documents` can stay ON (see .rag/harden-rls.sql). Unset is
          # fine — sources/_lib.mjs falls back to the anon key.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node ingest-files.mjs
