name: Seed documents

# Manually-triggered: embeds every file in rag/documents/ into Supabase.
# Run this from the Actions tab whenever you add or change docs in rag/documents/.
# (Separate from the live-news cron so your case studies aren't re-embedded every 3h.)

on:
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run file ingester
        working-directory: rag
        env:
          OPENROUTER_EMBED_KEY: ${{ secrets.OPENROUTER_EMBED_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node ingest-files.mjs
