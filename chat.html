<!-- SECURITY (M5): baseline CSP (defence-in-depth): object-src 'none', base-uri
     'self', form-action 'self'. MUST-FIX before launch (EdgeOne response headers — a
     <meta> can't do these): X-Frame-Options: DENY / frame-ancestors 'none' + HSTS on
     this page. chat.html holds an authenticated session, so it must not be framable. -->
<!-- SECURITY — Content Security Policy, delivered as a <meta> because it has to be.
     MEASURED 2026-08-22: `curl -D-` against the live site returns NO security
     headers on any HTML response. functions/_middleware.js was written to add
     them and never ran — EdgeOne serves static HTML from CDN cache without
     invoking Pages middleware, so the file was deleted rather than left as
     false assurance. The remaining header-only controls (HSTS, nosniff,
     X-Frame-Options) need an EdgeOne dashboard rule; see README > Security headers.

     'unsafe-inline' in script-src is unavoidable while the page is one file of
     inline <script> and onclick= handlers, so this policy does NOT block injected
     inline script. It DOES block the other half of a typical payload: loading
     code from an attacker's host, posting a form off-site, an injected <base>
     re-rooting every relative URL, and plugin objects. Strictly more than the
     object-src-only policy it replaces. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.cdnfonts.com; font-src 'self' https://fonts.gstatic.com https://fonts.cdnfonts.com; img-src 'self' data: blob:; connect-src 'self' https://www.google-analytics.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<script>
  // CLICKJACKING FALLBACK. The real control is `frame-ancestors 'none'` or
  // X-Frame-Options, and BOTH are response-header-only — a <meta> CSP cannot set
  // either, and no header currently reaches this page (see the CSP note above).
  // Until the EdgeOne dashboard rule exists, this is what stops the page being
  // framed under an attacker's overlay. It is weaker than a header — an iframe
  // sandboxed without allow-top-navigation can block the escape — so the catch
  // blanks the page rather than letting it render inside a frame regardless.
  if (self !== top) {
    try { top.location = self.location; }
    catch (e) { document.documentElement.style.display = 'none'; }
  }
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --mark: linear-gradient(90deg,#6366F1 0%,#3B82F6 50%,#0EA5E9 100%);
    --bg-sidebar: #171717;
    --bg-main: #0d0d0d;
    --bg-input: #2a2a2a;
    --accent: #0ea5e9;
    --accent2: #6366f1;
    /* Peach palette — adds warmth in terminal, anchors greeting, accents assistant bubbles */
    --peach:       #ffb088;
    --peach-soft:  #ffd7b0;
    --peach-deep:  #f08a5d;
    --peach-glow:  rgba(255,176,136,0.35);
    --peach-tint:  rgba(255,176,136,0.08);
    --gold:        #ffc850;
    --text: #ececec;
    --text2: #8a8a8a;
    --border: rgba(255,255,255,0.07);
    --hover: rgba(255,255,255,0.06);
    --sidebar-w: 260px;
  }

  html, body {
    height: 100%;
    background: var(--bg-main);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  /* Animated navy-blue background for the chat (shows behind the transparent main area) */
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -2;
    background: linear-gradient(135deg, #0a1838 0%, #102a5e 25%, #1d3f96 50%, #102a5e 75%, #0a1838 100%);
    background-size: 200% 200%;
    animation: gradientShift 26s ease-in-out infinite;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(circle at 18% 25%, rgba(56,104,224,0.28) 0%, transparent 55%),
      radial-gradient(circle at 82% 80%, rgba(40,72,180,0.22) 0%, transparent 55%);
    animation: gradientShift 40s ease-in-out infinite reverse;
    pointer-events: none;
  }
  body.light::before, body.light::after { display: none; }

  .app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    padding: 0.75rem 0.5rem;
    overflow: hidden;
    transition: width 0.25s ease;
  }
  .sidebar.collapsed { width: 64px; }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.3rem 0.5rem 0.6rem;
    gap: 0.5rem;
  }

  .sidebar-logo {
    display: flex; align-items: center; gap: 0.55rem;
    font-family: 'Old Standard TT', Georgia, 'Times New Roman', serif;
    font-weight: 700; font-size: 1.05rem;
    letter-spacing: 0.005em;
    background: var(--mark);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-decoration: none;
    white-space: nowrap; overflow: hidden;
    flex: 1; min-width: 0;
  }
  .sidebar-logo-icon {
    /* OPTICAL ALIGNMENT. Old Standard TT has a lopsided vertical box — hhea
       ascent 762 against descent 238 — so its glyphs sit ~0.1em ABOVE the centre
       of their own line box. `align-items: center` centres the BOX, not the ink,
       which left the mark floating above the wordmark after the Syne swap.
       Measured in-browser at 0.1003em; nudging the icon rather than the text
       keeps the wordmark's baseline consistent with the nav links beside it.
       In em, so it holds at every breakpoint. */
  transform: translateY(-0.1em);
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .sidebar-logo-icon svg { width: 15px; height: 15px; color: #000; }
  .sidebar-logo-text { overflow: hidden; white-space: nowrap; }
  .sidebar.collapsed .sidebar-logo { display: none; }
  .sidebar.collapsed .sidebar-logo-text { display: none; }

  .sidebar-toggle {
    background: none; border: none; cursor: pointer;
    color: var(--text2); padding: 0.4rem;
    border-radius: 8px; display: flex; align-items: center;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .sidebar-toggle:hover { background: var(--hover); color: #fff; }
  .sidebar-toggle svg { width: 18px; height: 18px; }

  .new-chat-btn {
    display: flex; align-items: center; gap: 0.75rem;
    background: var(--hover); border: none; cursor: pointer;
    color: var(--text); padding: 0.65rem 0.75rem;
    border-radius: 10px; font-family: 'DM Sans', sans-serif;
    font-size: 0.875rem; font-weight: 500;
    width: 100%; text-align: left;
    transition: background 0.15s;
    margin-bottom: 0.25rem;
    white-space: nowrap; overflow: hidden;
  }
  .new-chat-btn:hover { background: rgba(255,255,255,0.1); }
  .new-chat-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .sidebar.collapsed .new-chat-btn-label { display: none; }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
    margin-bottom: 0.75rem;
  }
  .nav-item {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.6rem 0.75rem;
    border-radius: 10px;
    color: var(--text2); text-decoration: none;
    font-size: 0.875rem; font-weight: 400;
    cursor: pointer; border: none; background: none;
    width: 100%; text-align: left;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap; overflow: hidden;
    font-family: 'DM Sans', sans-serif;
  }
  .nav-item:hover { background: var(--hover); color: #fff; }
  .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
  .sidebar.collapsed .nav-item-label { display: none; }
  /* Collapsed: only icons remain — center everything so all icons share the same axis */
  .sidebar.collapsed .sidebar-header,
  .sidebar.collapsed .nav-item,
  .sidebar.collapsed .new-chat-btn { justify-content: center; padding-left: 0; padding-right: 0; }

  .sidebar-divider {
    height: 1px; background: var(--border);
    margin: 0.5rem 0.25rem;
  }

  .recents-label {
    font-size: 0.72rem; font-weight: 600;
    letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--text2);
    padding: 0.5rem 0.75rem 0.4rem;
    white-space: nowrap;
  }
  .sidebar.collapsed .recents-label { display: none; }

  .recents-empty {
    padding: 0.5rem 0.75rem;
    font-size: 0.8rem; color: rgba(255,255,255,0.2);
    font-style: italic;

  .sidebar.collapsed .recents-empty { display: none; }

  /* ── MAIN ── */
  .chat-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ── HEADER ── */
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1.25rem;
    flex-shrink: 0;

  .header-title {
    display: flex; align-items: center; gap: 0.4rem;

  .header-title:hover { background: var(--hover); }
  .header-title svg { width: 14px; height: 14px; color: var(--text2); }

  .header-right {
    display: flex; align-items: center; gap: 0.6rem;
  }

  .header-nav-btn {
    display: flex; align-items: center; gap: 0.4rem;
    background: none; border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 0.45rem 0.9rem;
    border-radius: 8px; font-size: 0.82rem; font-weight: 500;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
    text-decoration: none;
  }
  .header-nav-btn:hover { background: var(--hover); border-color: rgba(255,255,255,0.3); }
  .header-nav-btn svg { width: 13px; height: 13px; color: var(--accent); }

  .upgrade-btn {
    display: flex; align-items: center; gap: 0.4rem;
    background: none; border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 0.45rem 0.9rem;
    border-radius: 8px; font-size: 0.82rem; font-weight: 500;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    transition: background 0.15s, border-color 0.15s;

  }
  .upgrade-btn:hover { background: var(--hover); border-color: rgba(255,255,255,0.3); }
  .upgrade-btn svg { width: 13px; height: 13px; color: var(--accent); }

  .user-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700;
    color: #fff; cursor: pointer; flex-shrink: 0;
    letter-spacing: 0.02em;
    transition: opacity 0.15s;
  }
  .user-avatar:hover { opacity: 0.85; }

  /* ── ACCOUNT MENU (animated, New 01-inspired) ──
     Smooth slide+fade open; each item staggers in; hover slides a left
     indicator and shifts the icon right; subtle cyan accent throughout. */
  .account-wrap { position: relative; }
  .user-avatar {
    transition: transform 0.2s, box-shadow 0.25s;
  }
  .user-avatar:hover {
    transform: scale(1.05);
    box-shadow: 0 0 0 3px rgba(14,165,233,0.18);
  }
  .account-menu {
    position: absolute; top: calc(100% + 10px); right: 0;
    min-width: 264px;
    background:
      radial-gradient(circle at 0% 0%, rgba(14,165,233,0.10), transparent 55%),
      #0d1620;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px;
    padding: 6px;
    box-shadow:
      0 20px 50px rgba(0,0,0,0.65),
      0 0 0 1px rgba(255,255,255,0.02) inset;
    opacity: 0;
    transform: translateY(-8px) scale(0.97);
    transform-origin: top right;
    pointer-events: none;
    transition:
      opacity 0.18s ease,
      transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 250;
    overflow: hidden;
  }
  .account-menu.open {
    opacity: 1;
    transform: none;
    pointer-events: all;
  }
  /* Top accent line that draws in on open */
  .account-menu::before {
    content: '';
    position: absolute; top: 0; left: 0;
    height: 1px; width: 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    transition: width 0.4s ease 0.05s;
  }
  .account-menu.open::before { width: 100%; }

  .account-header {
    display: flex; align-items: center; gap: 11px;
    padding: 14px 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 6px;
    position: relative;
  }
  .account-header-avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, #6366f1 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 800; color: #fff;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(14,165,233,0.35);
    position: relative;
  }
  /* Removed 2026-08-22: the pulsing green presence dot on the avatar. It
     signalled "online", which was never a real state this product tracks —
     there is no presence system, so it animated forever regardless of anything.
     A permanently-blinking indicator that means nothing is noise, and on an
     avatar it implies a liveness guarantee the app does not make. */
  .account-header-info { overflow: hidden; min-width: 0; }
  .account-header-name {
    font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 700;
    color: #fff; letter-spacing: -0.01em;
    line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .account-header-email {
    font-size: 11.5px; color: rgba(255,255,255,0.45);
    margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Items: stagger entry, slide hover indicator, animated icons */
  .account-menu-item {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 12px;
    border-radius: 10px;
    color: rgba(255,255,255,0.68);
    text-decoration: none;
    font-size: 13.5px; font-weight: 500;
    cursor: pointer; border: none; background: none;
    width: 100%; text-align: left;
    font-family: 'DM Sans', sans-serif;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateX(-6px);
    transition: color 0.18s, background 0.18s;
  }
  .account-menu.open .account-menu-item {
    animation: dd-item-in 0.32s cubic-bezier(0.22, 0.68, 0, 1.05) forwards;
  }
  .account-menu.open .account-menu-item:nth-child(2) { animation-delay: 0.04s; }
  .account-menu.open .account-menu-item:nth-child(3) { animation-delay: 0.08s; }
  .account-menu.open .account-menu-item:nth-child(4) { animation-delay: 0.12s; }
  .account-menu.open .account-menu-item:nth-child(5) { animation-delay: 0.16s; }
  .account-menu.open .account-menu-item:nth-child(7) { animation-delay: 0.22s; }
  @keyframes dd-item-in {
    to { opacity: 1; transform: translateX(0); }
  }

  /* Sliding left indicator */
  .account-menu-item::before {
    content: '';
    position: absolute; left: 0; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 0;
    background: var(--accent);
    border-radius: 0 3px 3px 0;
    transition: height 0.22s ease;
  }
  .account-menu-item:hover::before { height: 60%; }
  .account-menu-item:hover {
    background: rgba(14,165,233,0.08);
    color: #fff;
  }
  .account-menu-item svg {
    width: 16px; height: 16px;
    color: rgba(255,255,255,0.4);
    flex-shrink: 0;
    transition: transform 0.22s ease, color 0.18s;
  }
  .account-menu-item:hover svg {
    color: var(--accent);
    transform: translateX(2px) scale(1.08);
  }

  .account-menu-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    margin: 6px 4px;
  }

  .account-menu-item.danger { color: rgba(248,113,113,0.82); }
  .account-menu-item.danger svg { color: rgba(248,113,113,0.6); }
  .account-menu-item.danger:hover {
    background: rgba(239,68,68,0.09);
    color: #fca5a5;
  }
  .account-menu-item.danger:hover::before { background: #f87171; }
  .account-menu-item.danger:hover svg { color: #f87171; transform: translateX(2px) scale(1.08); }

  /* Light theme */
  body.light { --mark: linear-gradient(90deg,#0EA5E9 0%,#3B82F6 50%,#404BA0 100%); }
  body.light .account-menu {
    background:

  /* ── CENTER CONTENT ── */
  .chat-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; /* centers greeting when empty */
    padding: 2rem 1.5rem 6rem;
    overflow-y: auto;
  }
  /* When messages exist, switch to flex-start so overflow scrolls correctly.
     justify-content:center clips the top of overflowing content — it's a
     known flex/scroll bug. flex-start lets you scroll all the way to the top. */
  .chat-content.has-messages { justify-content: flex-start; padding-bottom: 0; }
  /* margin-top:auto anchors a short conversation to the BOTTOM of the screen
     (like modern chat apps) instead of floating at the top. Once the chat grows
     taller than the screen it scrolls normally. */
  .chat-content.has-messages .messages { margin: auto auto 1.5rem; }
  /* Prompt box stays pinned to the bottom of the screen while messages
     scroll behind it. Solid background hides the scrolling content. */
  .chat-content.has-messages .prompt-wrap {
    position: sticky; bottom: 0; z-index: 5;
    padding: 0.5rem 0 1.25rem;
    background: var(--bg-main);
  }

  .chat-greeting {
    /* Gilbert is a heavy display sans; Outfit/Syne are the graceful fallbacks
       in case the CDN font hasn't loaded by paint. */
    font-family: 'Gilbert', 'Outfit', 'Syne', sans-serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 900;
    color: #fff;
    text-align: center;
    margin-bottom: 2.25rem;
    letter-spacing: -0.04em;
    line-height: 1.05;
    text-wrap: balance;
  }
  .chat-greeting em {
    font-style: normal;
    color: var(--text);
  }
  @keyframes peach-shimmer {
    0%, 100% { background-position: 0% center; }
    50%      { background-position: 100% center; }
  }
  .chat-greeting-sub {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 400;
    color: var(--text2);
    text-align: center;
    margin-top: -1.25rem;
    margin-bottom: 2.25rem;
    letter-spacing: 0.01em;
  }

  /* ── PROMPT INPUT ── */
  .prompt-wrap {
    width: 100%;
    max-width: 720px;
  }

  .prompt-box {
    background: var(--bg-input);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 0.85rem 0.85rem 0.85rem 1.1rem;
    display: flex;
    align-items: flex-end;
    gap: 0.6rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  /* Now the ONLY focus indicator for the composer, so it has to be legible on
     its own — brighter border, no coloured glow. Neutral rather than accent:
     the blue ring is what read as a stray box. */
  .prompt-box:focus-within {
    /* 0.1 -> 0.42 on the SAME border, so focus is a clear change to a line that
       is already there rather than a new box drawn around the control. Sized
       deliberately: this is now the composer's only focus indicator, so a
       barely-perceptible delta would be an accessibility regression dressed up
       as a design tweak. */
    border-color: rgba(255,255,255,0.42);
  }

  .prompt-attach {
    background: none; border: none; cursor: pointer;
    color: var(--text2); padding: 0.3rem;
    border-radius: 7px; display: flex;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0; align-self: flex-end; margin-bottom: 2px;
  }
  .prompt-attach:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .prompt-attach svg { width: 18px; height: 18px; }

  /* ── ATTACH MENU & FILE CHIP ── */
  .attach-wrap { position: relative; flex-shrink: 0; align-self: flex-end; }
  .attach-menu {
    position: absolute; bottom: calc(100% + 10px); left: 0;
    background: #1a1a2a; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 6px; min-width: 188px;
    opacity: 0; transform: translateY(6px) scale(0.97);
    transform-origin: bottom left; pointer-events: none;
    transition: opacity 0.15s, transform 0.18s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 200; box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  }
  .attach-menu.open { opacity: 1; transform: none; pointer-events: all; }
  .attach-menu-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 9px 12px; border: none; background: none;
    cursor: pointer; color: rgba(255,255,255,0.75);
    font-size: 0.84rem; font-weight: 500;
    font-family: 'DM Sans', sans-serif; border-radius: 8px; text-align: left;
    transition: background 0.12s, color 0.12s;
  }
  .attach-menu-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .attach-menu-item svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--text2); transition: color 0.12s; }
  .attach-menu-item:hover svg { color: var(--accent); }
  .attach-chip-area { display: none; padding: 0 0.25rem 0.45rem; }
  .attach-chip-area.has-chip { display: flex; }
  .attach-chip {
    display: inline-flex; align-items: center; gap: 0.4rem;
    background: rgba(14,165,233,0.12); border: 1px solid rgba(14,165,233,0.3);
    border-radius: 8px; padding: 0.28rem 0.55rem 0.28rem 0.45rem;
    font-size: 0.78rem; font-weight: 500; font-family: 'DM Sans', sans-serif;
    color: #c0d8f5;
  }
  .attach-chip img { width: 24px; height: 24px; border-radius: 4px; object-fit: cover; }
  .attach-chip > svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--accent); }
  .attach-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .attach-chip-remove {
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.35); padding: 0 1px; margin-left: 2px;
    display: flex; align-items: center; transition: color 0.12s;
  }
  .attach-chip-remove:hover { color: #f87171; }
  .attach-chip-remove svg { width: 12px; height: 12px; }
  body.light .attach-menu { background: #fff; border-color: rgba(0,0,0,0.1); box-shadow: 0 8px 28px rgba(0,0,0,0.1); }
  body.light .attach-menu-item { color: rgba(0,0,0,0.7); }
  body.light .attach-menu-item:hover { background: rgba(0,0,0,0.06); color: #000; }
  body.light .attach-chip { background: rgba(14,165,233,0.08); border-color: rgba(14,165,233,0.25); color: #1a5fa8; }

  /* The global :focus-visible rule further down paints a 2px --accent (#0ea5e9)
     outline around whatever has keyboard focus. On this textarea that drew a
     hard blue rectangle INSIDE the composer, boxed off from the + and mic
     buttons — it read as a form field bolted into the bar rather than one
     surface. Suppressed HERE only, because the container's :focus-within
     treatment already shows focus and does it around the whole control.
     Focus is still visible; it just moved outward. Do not add `outline: none`
     globally to get the same look — that removes the indicator entirely. */
  .prompt-input:focus-visible { outline: none; }

  .prompt-input {
    flex: 1;
    background: none; border: none; outline: none;
    color: #fff; font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem; font-weight: 400;
    resize: none; line-height: 1.6;
    min-height: 24px; max-height: 200px;
    overflow-y: auto;
    padding: 0.15rem 0;
  }
  .prompt-input::placeholder { color: var(--text2); }

  .prompt-actions {
    display: flex; align-items: center; gap: 0.35rem;
    flex-shrink: 0; align-self: flex-end;
  }

  .prompt-icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text2); padding: 0.35rem;
    border-radius: 8px; display: flex; align-items: center;
    transition: background 0.15s, color 0.15s;
  }
  .prompt-icon-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .prompt-icon-btn svg { width: 18px; height: 18px; }

  .prompt-send {
    background: #fff; border: none; cursor: pointer;
    color: #000; width: 32px; height: 32px;
    border-radius: 8px; display: flex;
    align-items: center; justify-content: center;
    transition: background 0.15s, opacity 0.15s;
    flex-shrink: 0;
  }
  .prompt-send:hover { background: var(--accent); }
  .prompt-send svg { width: 15px; height: 15px; }

  /* ── CONVERSATION AREA (hidden initially, shown when messages exist) ── */
  .messages { display: none; }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    /* Sidebar + header cleanup */
    .sidebar { display: none; }
    .upgrade-btn span { display: none; }
    .header-nav-btn span { display: none; }

    /* Reduce header padding on mobile */
    .chat-header { padding: 0.5rem 0.75rem; }

    /* Tighter content padding on mobile — from 2rem 1.5rem to 1rem 0.75rem */
    .chat-content { padding: 1rem 0.75rem 5rem; }

    /* Reduce greeting size on mobile: clamp to smaller max */
    .chat-greeting { font-size: clamp(1.8rem, 4.5vw, 2.8rem); margin-bottom: 1.5rem; }

    /* Shrink subtitle */
    .chat-greeting-sub { font-size: 0.85rem; margin-top: -0.8rem; margin-bottom: 1.5rem; }

    /* Reduce prompt input font to 16px (iOS won't zoom on focus) */
    .prompt-input { font-size: 16px; }

    /* Tighter prompt wrap padding */
    .chat-content.has-messages .prompt-wrap { padding: 0.35rem 0 0.75rem; }

    /* Account menu breaks off-screen on mobile: reposition to left-align */
    .account-menu {
      transform-origin: top right;
      right: -120px;
    }
    .account-menu.open { right: -120px; }
  }

  /* ── LIGHT MODE (warm peach-cream palette) ── */
  body.light {
    --bg-sidebar: #f3dccc;   /* dusty peach */
    --bg-main:    #fdf6ed;   /* cream */
    --bg-input:   #f7e7d6;   /* light peach */
    --text:       #2a1810;
    --text2:      #7d5945;   /* warm taupe */
    --border:     rgba(120,60,30,0.10);
    --hover:      rgba(255,176,136,0.18);
    --peach-tint: rgba(240,138,93,0.10);
    --peach-glow: rgba(240,138,93,0.30);
  }
  body.light .msg.assistant {
    /* Warm cream bubble that sits on the peach-cream page background */
    background: #fff8f2;
    border-left-color: #f08a5d;   /* peach accent matches the palette */
    color: #2a1810;               /* same dark brown as --text */
    box-shadow: 0 4px 18px -8px rgba(200,100,50,0.12);
  }
  body.light .msg.assistant a { color: #c05a20; }
  /* The dark-mode heading/bold/code colours are near-white — override them back to
     dark tones so they stay readable on the light cream bubble. */
  body.light .msg.assistant strong { color: #1a0f08; }
  body.light .msg.assistant h2 { color: #241009; }
  body.light .msg.assistant h3 { color: #3a1c10; }
  body.light .msg.assistant li::marker { color: #f08a5d; }
  body.light .msg.assistant { border-color: rgba(120,60,30,0.12); }
  body.light .msg.assistant code { background: rgba(0,0,0,0.07); color: #7a3410; }
  body.light .msg.assistant pre { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.08); }
  body.light .msg.assistant pre code { color: #2a1810; }
  body.light .chat-greeting { color: #2a1810; }
  body.light .chat-greeting em {
    color: var(--text);
  }
  body.light .sidebar { background: var(--bg-sidebar); }
  body.light .sidebar-logo { color: #111; }
  body.light .sidebar-toggle { color: rgba(0,0,0,0.45); }
  body.light .sidebar-toggle:hover { color: #000; background: rgba(0,0,0,0.07); }
  body.light .new-chat-btn { background: rgba(0,0,0,0.06); color: var(--text); }
  body.light .new-chat-btn:hover { background: rgba(0,0,0,0.1); }
  body.light .nav-item { color: rgba(0,0,0,0.5); }
  body.light .nav-item:hover { background: rgba(0,0,0,0.07); color: #000; }
  body.light .sidebar-divider { background: rgba(0,0,0,0.1); }
  body.light .recents-label { color: rgba(0,0,0,0.45); }
  body.light .recents-empty { color: rgba(0,0,0,0.28); }

  /* ── RECENT CHATS STYLING ── */
  .recents-empty {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    max-height: 200px;
    overflow-y: auto;
  }
  .recents-empty.has-recents {
    gap: 0.6rem;
  }
  .recent-chat-item {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    padding: 0.7rem 0.6rem;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 2px solid var(--accent);
  }
  .recent-chat-item:hover {
    background: rgba(255,255,255,0.08);
  }
  .recent-preview {
    font-size: 0.8rem;
    color: var(--text);
    line-height: 1.3;
  }
  .recent-date {
    font-size: 0.7rem;
    color: var(--text2);
  }
  body.light .recent-chat-item {
    background: rgba(0,0,0,0.05);
    border-left-color: var(--peach-deep);
  }
  body.light .recent-chat-item:hover {
    background: rgba(0,0,0,0.08);
  }

  body.light .chat-main { background: var(--bg-main); }
  body.light .chat-header { background: var(--bg-main); }
  body.light .header-title { color: #111; }
  body.light .header-title:hover { background: rgba(0,0,0,0.05); }
  body.light .header-title svg { color: rgba(0,0,0,0.4); }
  body.light .header-nav-btn { color: #111; border-color: rgba(0,0,0,0.15); }
  body.light .header-nav-btn:hover { background: rgba(0,0,0,0.06); }
  body.light .header-nav-btn svg { color: var(--peach-deep); }
  body.light .upgrade-btn { color: #111; border-color: rgba(0,0,0,0.15); }
  body.light .upgrade-btn:hover { background: rgba(0,0,0,0.06); }
  body.light .chat-greeting { color: #0d0d12; }
  body.light .prompt-box { background: var(--bg-input); border-color: rgba(0,0,0,0.1); }
  body.light .prompt-box:focus-within { border-color: rgba(0,0,0,0.42); }
  body.light .prompt-input { color: #0d0d12; }
  body.light .prompt-input::placeholder { color: rgba(0,0,0,0.3); }
  body.light .prompt-attach { color: rgba(0,0,0,0.45); }
  body.light .prompt-attach:hover { color: #000; background: rgba(0,0,0,0.07); }
  body.light .prompt-icon-btn { color: rgba(0,0,0,0.45); }
  body.light .prompt-icon-btn:hover { color: #000; background: rgba(0,0,0,0.07); }
  body.light .prompt-send { background: #111; color: #fff; }
  body.light .prompt-send:hover { background: var(--accent); }

  /* ── CINEMATIC THEME TOGGLE (bottom-right fixed) ── */
  .theme-toggle {
    position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 300;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(8,8,14,0.78);
    border: 1px solid rgba(255,255,255,0.13);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.65);
    transition: background 0.3s, color 0.3s, border-color 0.3s;
    animation: cglow-dark 3s ease-in-out infinite;
  }
  @keyframes cglow-dark {
    0%,100% { box-shadow: 0 0 14px rgba(14,165,233,0.22), 0 0 28px rgba(14,165,233,0.08); }
    50%      { box-shadow: 0 0 24px rgba(14,165,233,0.38), 0 0 48px rgba(14,165,233,0.13); }
  }
  .theme-toggle:hover { background: rgba(14,14,22,0.92); color: #fff; border-color: rgba(255,255,255,0.22); }
  .theme-toggle svg { width: 17px; height: 17px; transition: transform 0.4s; }
  .theme-toggle:hover svg { transform: rotate(20deg); }
  .theme-icon-moon { display: block; }
  .theme-icon-sun  { display: none; }
  body.light .theme-toggle {
    background: rgba(240,239,234,0.86); border-color: rgba(0,0,0,0.14); color: rgba(0,0,0,0.6);
    animation: cglow-light 3s ease-in-out infinite;
  }
  @keyframes cglow-light {
    0%,100% { box-shadow: 0 0 14px rgba(234,179,8,0.28), 0 0 28px rgba(234,179,8,0.1); }
    50%      { box-shadow: 0 0 24px rgba(234,179,8,0.46), 0 0 48px rgba(234,179,8,0.16); }
  }
  body.light .theme-toggle:hover { background: rgba(224,223,218,0.96); color: #000; }
  body.light .theme-icon-moon { display: none; }
  body.light .theme-icon-sun  { display: block; }

  /* ── HAMBURGER (mobile only) ── */
  .hamburger {
    display: none;
    background: none; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; padding: 0.4rem;
    color: var(--text);
    width: 36px; height: 36px;
    align-items: center; justify-content: center;
    margin-right: 0.4rem;
  }
  .hamburger svg { width: 18px; height: 18px; }
  .hamburger:hover { background: var(--hover); }
  body.light .hamburger { border-color: rgba(0,0,0,0.12); }

  /* mobile: sidebar becomes a slide-in drawer */
  @media (max-width: 640px) {
    .hamburger { display: flex; }
    .sidebar {
      display: flex !important;
      position: fixed; top: 0; left: 0; bottom: 0;
      width: 280px;
      z-index: 400;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 8px 0 32px rgba(0,0,0,0.5);
    }
    .sidebar.mobile-open { transform: translateX(0); }
    .sidebar-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 350; opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .sidebar-backdrop.show { opacity: 1; pointer-events: all; }
  }
  .sidebar-backdrop { display: none; }
  @media (max-width: 640px) { .sidebar-backdrop { display: block; } }

  /* ── MESSAGE BUBBLES ── */
  .messages {
    width: 100%; max-width: 720px;
    margin: 0 auto 1.5rem;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .messages.has-messages { display: flex; }
  .msg {
    padding: 0.85rem 1.1rem;
    border-radius: 14px;
    /* Reading comfort: slightly larger body + more open leading so long
       reasoning answers don't feel dense. */
    font-size: 1rem; line-height: 1.72;
    word-wrap: break-word;
  }
  /* THEME TOGGLE vs SEND BUTTON. The toggle is fixed bottom-right; once a chat has
     messages the composer moves to the bottom, and on narrow screens its Send button
     lands under the toggle (z-index 300) — a tap on Send flipped the theme instead.
     A mobile override used to exist at ~L724, but it sat BEFORE the base rule above
     and equal specificity means the later rule wins, so it never applied. It lives
     here now, after the base, and covers every width where the two can collide:
     the composer is max 720px centred in the space right of the sidebar, so its right
     edge reaches the toggle below ~1110px (measured at 768, 812, 1024 as well as phones). */
  @media (max-width: 1120px) { .theme-toggle { bottom: 6.5rem; } }
  @media (max-width: 640px) {
    .theme-toggle { right: 0.75rem; width: 38px; height: 38px; }
    .theme-toggle svg { width: 15px; height: 15px; }
  }
  /* User messages are plain text — keep literal whitespace */
  .msg.user { white-space: pre-wrap; }
  /* Markdown element styles inside assistant bubbles */
  .msg.assistant p { margin: 0 0 0.8rem; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant ul, .msg.assistant ol { padding-left: 1.4rem; margin: 0.5rem 0 0.85rem; }
  .msg.assistant li { margin-bottom: 0.45rem; }
  .msg.assistant li::marker { color: var(--accent); }   /* branded bullet/number */
  .msg.assistant strong { font-weight: 700; color: #f4f7fc; }  /* key terms pop a touch brighter */
  .msg.assistant em { font-style: italic; }
  .msg.assistant code {
    font-family: 'Fira Code', 'Courier New', monospace; font-size: 0.86em;
    background: rgba(122,167,255,0.14); color: #cdddff;
    padding: 0.12em 0.4em; border-radius: 5px;
  }
  .msg.assistant pre {
    background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px; padding: 0.85rem 1rem; margin: 0.7rem 0;
    overflow-x: auto;
  }
  .msg.assistant pre code { background: none; padding: 0; color: #dfe7f5; font-size: 0.85rem; }
  .msg.assistant a { color: #86b0ff; text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .msg.assistant a:hover { color: #a8c6ff; }
  /* Clear heading hierarchy so scannable structure emerges from a wall of text. */
  .msg.assistant h2 { font-size: 1.16rem; font-weight: 700; color: #f2f6fd; margin: 1rem 0 0.35rem; letter-spacing: -0.01em; }
  .msg.assistant h3 { font-size: 1.02rem; font-weight: 600; color: #eaf0fa; margin: 0.85rem 0 0.3rem; }
  .msg.assistant h2:first-child, .msg.assistant h3:first-child { margin-top: 0; }
  .msg.assistant hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 0.9rem 0; }
  .msg.user {
    align-self: flex-end;
    background: var(--bg-input);
    border: 1px solid rgba(255,255,255,0.08);
    max-width: 80%;
  }
  .msg.assistant {
    align-self: flex-start;
    /* SOLID (fully opaque) deep-navy reading surface. The old bubble was 0.94
       alpha, so the ANIMATED page gradient bled through and subtly shifted the
       contrast under the text as it moved — the main eye-strain cause. An opaque
       surface keeps the reading contrast dead-steady. */
    background: linear-gradient(180deg, #141f39 0%, #111a30 100%);
    border: 1px solid rgba(255,255,255,0.06);
    border-left: 3px solid var(--accent); /* refined brand accent rail */
    color: #dfe6f2;                       /* soft off-white — high contrast without pure-white glare */
    max-width: 100%;
    border-radius: 16px;
    padding: 1rem 1.3rem;
    letter-spacing: 0.002em;
    box-shadow: 0 12px 34px -20px rgba(0,0,0,0.75);
  }
  .msg.assistant a { color: #86b0ff; }
  .msg.assistant.thinking {
    display: inline-flex; align-items: center;
    padding: 0.95rem 1.2rem;
  }
  /* The dots alone carried the entire 8.5s wait on a product whose whole pitch
     is source-grounding — the most differentiating seconds looked identical to
     every other chatbot, and indistinguishable from hung. The label names the
     work instead. Purely cosmetic: no timing promise, it reflects real phases. */
  .think-label {
    margin-left: 10px; font-size: 0.82rem;
    color: rgba(255,255,255,0.45); font-family: 'DM Sans', sans-serif;
  }
  body.light .think-label { color: rgba(0,0,0,0.45); }
  .think-dots { display: inline-flex; gap: 6px; align-items: center; }
  .think-dots i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    animation: thinkBounce 1.15s ease-in-out infinite;
  }
  .think-dots i:nth-child(2) { animation-delay: 0.16s; }
  .think-dots i:nth-child(3) { animation-delay: 0.32s; }
  @keyframes thinkBounce {
    0%, 65%, 100% { transform: translateY(0); opacity: 0.40; }
    32%           { transform: translateY(-7px); opacity: 1; }
  }
  .msg.assistant.error {
    color: #f87171;
    background: rgba(248,113,113,0.06);
    border: 1px solid rgba(248,113,113,0.25);
  }

  /* ── MESSAGE ACTION BUTTONS (copy / share) ── */
  .msg-actions {
    display: flex;
    align-items: center;
    gap: 0.2rem;
    margin-top: 0.65rem;
    padding-top: 0.55rem;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  .msg-action-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text2);
    padding: 0.25rem 0.5rem;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.75rem;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .msg-action-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .msg-action-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  /* Toast */
  .action-toast {
    position: fixed;
    bottom: 5.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: rgba(14,165,233,0.92);
    color: #fff;
    padding: 0.38rem 1rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.18s, transform 0.18s;
    z-index: 999;
    box-shadow: 0 4px 14px rgba(14,165,233,0.35);
  }
  .action-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  body.light .msg-actions { border-top-color: rgba(0,0,0,0.07); }
  body.light .msg-action-btn:hover { background: rgba(0,0,0,0.07); color: #000; }
  body.light .action-toast { background: rgba(14,165,233,0.88); }

  body.light .msg.user { background: var(--bg-input); border-color: rgba(0,0,0,0.08); }

  /* ── PROJECTS OVERLAY ── */
  .proj-overlay {
    position: fixed; inset: 0; z-index: 600;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .proj-overlay.open { opacity: 1; pointer-events: all; }

  .proj-panel {
    width: 100%; max-width: 740px; height: min(82vh, 620px);
    background: #0e1525;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.75);
    display: flex; flex-direction: column;
    overflow: hidden;
    transform: translateY(12px) scale(0.98);
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
  }
  .proj-overlay.open .proj-panel { transform: none; }

  /* Top bar */
  .proj-topbar {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
  }
  .proj-topbar h2 {
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: 1.1rem; letter-spacing: -0.02em; color: #fff; flex: 1;
  }
  .proj-new-btn {
    display: flex; align-items: center; gap: 0.4rem;
    background: var(--accent); border: none; cursor: pointer;
    color: #000; padding: 0.45rem 0.85rem;
    border-radius: 9px; font-size: 0.82rem; font-weight: 700;
    font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s;
  }
  .proj-new-btn:hover { opacity: 0.85; }
  .proj-new-btn svg { width: 13px; height: 13px; }
  .proj-close-btn {
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.35); font-size: 1rem;
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, color 0.12s;
  }
  .proj-close-btn:hover { background: rgba(255,255,255,0.07); color: #fff; }

  /* Two-pane body */
  .proj-body { display: flex; flex: 1; overflow: hidden; }

  /* Left: project list */
  .proj-list-pane {
    width: 220px; flex-shrink: 0;
    border-right: 1px solid rgba(255,255,255,0.07);
    overflow-y: auto; padding: 0.5rem 0;
  }
  .proj-list-item {
    display: flex; align-items: center; gap: 0.55rem;
    padding: 0.65rem 1rem;
    cursor: pointer; border: none; background: none; width: 100%;
    font-family: 'DM Sans', sans-serif; font-size: 0.87rem; font-weight: 500;
    color: rgba(255,255,255,0.62); text-align: left;
    transition: background 0.12s, color 0.12s;
    position: relative;
  }
  .proj-list-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .proj-list-item.active { background: rgba(14,165,233,0.1); color: #fff; }
  .proj-list-item.active::before {
    content: '';

    background: var(--accent); border-radius: 0 3px 3px 0;
  }
  .proj-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .proj-list-name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .proj-list-count {
    font-size: 0.7rem; background: rgba(255,255,255,0.08);
    border-radius: 10px; padding: 0.1rem 0.45rem;
    color: rgba(255,255,255,0.45); flex-shrink: 0;
  }
  .proj-list-empty {
    padding: 1.5rem 1rem;
    font-size: 0.8rem; color: rgba(255,255,255,0.25);
    text-align: center; font-style: italic;
  }

  /* Right: project detail */
  .proj-detail-pane {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  .proj-detail-header {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.85rem 1.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
  }
  .proj-detail-dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
  .proj-detail-name {
    font-family: 'Syne', sans-serif; font-weight: 700;
    font-size: 1rem; color: #fff; flex: 1;
    border: none; background: none; outline: none;
    padding: 2px 4px; border-radius: 5px;
    transition: background 0.12s;
  }
  .proj-detail-name:focus { background: rgba(255,255,255,0.07); }
  .proj-add-chat-btn {
    display: flex; align-items: center; gap: 0.35rem;
    background: rgba(14,165,233,0.12); border: 1px solid rgba(14,165,233,0.3);
    color: #7dcfff; padding: 0.35rem 0.7rem;
    border-radius: 8px; font-size: 0.78rem; font-weight: 600;
    font-family: 'DM Sans', sans-serif; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .proj-add-chat-btn:hover { background: rgba(14,165,233,0.22); border-color: rgba(14,165,233,0.5); }
  .proj-add-chat-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .proj-add-chat-btn svg { width: 12px; height: 12px; }
  .proj-delete-proj-btn {
    background: none; border: none; cursor: pointer;
    color: rgba(248,113,113,0.5); padding: 0.3rem;
    border-radius: 7px; display: flex; align-items: center;
    transition: background 0.12s, color 0.12s;
  }
  .proj-delete-proj-btn:hover { background: rgba(239,68,68,0.1); color: #f87171; }
  .proj-delete-proj-btn svg { width: 15px; height: 15px; }

  /* Color picker row */
  .proj-color-row {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.55rem 1.1rem;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
  }
  .proj-color-label { font-size: 0.72rem; color: rgba(255,255,255,0.35); }
  .proj-color-swatch {
    width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s;
  }
  .proj-color-swatch:hover { transform: scale(1.2); }
  .proj-color-swatch.selected { border-color: #fff; transform: scale(1.15); }

  /* Chat list inside a project */
  .proj-chat-list { flex: 1; overflow-y: auto; padding: 0.4rem 0; }
  .proj-chat-item {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.7rem 1.1rem;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.12s, border-color 0.12s;
  }
  .proj-chat-item:hover { background: rgba(255,255,255,0.04); }
  .proj-chat-item:hover { border-left-color: rgba(14,165,233,0.4); }
  .proj-chat-info { flex: 1; min-width: 0; }
  .proj-chat-preview {
    font-size: 0.85rem; color: #dfe6f5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .proj-chat-date { font-size: 0.72rem; color: rgba(255,255,255,0.32); margin-top: 2px; }
  .proj-chat-remove {
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.2); padding: 0.2rem;
    border-radius: 5px; display: flex; align-items: center;
    flex-shrink: 0; opacity: 0;
    transition: background 0.12s, color 0.12s, opacity 0.12s;
  }
  .proj-chat-item:hover .proj-chat-remove { opacity: 1; }
  .proj-chat-remove:hover { background: rgba(239,68,68,0.1); color: #f87171; }
  .proj-chat-remove svg { width: 13px; height: 13px; }
  .proj-chat-empty {
    padding: 2.5rem 1.5rem; text-align: center;
    color: rgba(255,255,255,0.25); font-size: 0.85rem; font-style: italic;
  }

  /* Empty state (no projects yet) */
  .proj-welcome {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0.75rem;
    color: rgba(255,255,255,0.25); padding: 2rem;
    text-align: center;
  }
  .proj-welcome svg { width: 44px; height: 44px; opacity: 0.2; }
  .proj-welcome p { font-size: 0.88rem; line-height: 1.5; }

  /* New project inline form */
  .proj-new-form {
    display: none; flex-direction: column; gap: 0.65rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(14,165,233,0.04);
  }
  .proj-new-form.open { display: flex; }
  .proj-new-form input {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px; padding: 0.55rem 0.75rem;
    color: #fff; font-family: 'DM Sans', sans-serif; font-size: 0.88rem;
    outline: none; transition: border-color 0.15s;
  }
  .proj-new-form input:focus { border-color: var(--accent); }
  .proj-new-form input::placeholder { color: rgba(255,255,255,0.25); }
  .proj-new-form-colors { display: flex; align-items: center; gap: 0.5rem; }
  .proj-new-form-actions { display: flex; gap: 0.5rem; }
  .proj-create-btn {
    flex: 1; background: var(--accent); border: none; cursor: pointer;
    color: #000; padding: 0.5rem; border-radius: 8px;
    font-family: 'DM Sans', sans-serif; font-size: 0.82rem; font-weight: 700;
    transition: opacity 0.15s;
  }
  .proj-create-btn:hover { opacity: 0.85; }
  .proj-cancel-btn {
    background: rgba(255,255,255,0.06); border: none; cursor: pointer;
    color: rgba(255,255,255,0.5); padding: 0.5rem 0.75rem;
    border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
    transition: background 0.12s;
  }
  .proj-cancel-btn:hover { background: rgba(255,255,255,0.1); }

  /* Light theme */
  body.light .proj-panel { background: #f7f0e8; border-color: rgba(0,0,0,0.1); }
  body.light .proj-topbar { border-color: rgba(0,0,0,0.08); }
  body.light .proj-topbar h2 { color: #1a1a2a; }
  body.light .proj-close-btn { color: rgba(0,0,0,0.35); }
  body.light .proj-close-btn:hover { background: rgba(0,0,0,0.06); color: #000; }
  body.light .proj-list-pane { border-color: rgba(0,0,0,0.08); }
  body.light .proj-list-item { color: rgba(0,0,0,0.55); }
  body.light .proj-list-item:hover { background: rgba(0,0,0,0.05); color: #000; }
  body.light .proj-list-item.active { background: rgba(14,165,233,0.08); color: #000; }
  body.light .proj-list-count { background: rgba(0,0,0,0.07); color: rgba(0,0,0,0.4); }
  body.light .proj-detail-pane, body.light .proj-detail-header { border-color: rgba(0,0,0,0.07); }
  body.light .proj-detail-name { color: #1a1a2a; }
  body.light .proj-detail-name:focus { background: rgba(0,0,0,0.04); }
  body.light .proj-chat-preview { color: #2a1810; }
  body.light .proj-chat-date { color: rgba(0,0,0,0.38); }
  body.light .proj-chat-item:hover { background: rgba(0,0,0,0.04); }
  body.light .proj-new-form { background: rgba(14,165,233,0.04); border-color: rgba(0,0,0,0.07); }
  body.light .proj-new-form input { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.1); color: #1a1a2a; }
  body.light .proj-cancel-btn { background: rgba(0,0,0,0.06); color: rgba(0,0,0,0.5); }
  body.light .proj-cancel-btn:hover { background: rgba(0,0,0,0.1); }
  body.light .proj-welcome { color: rgba(0,0,0,0.25); }
  body.light .proj-chat-empty { color: rgba(0,0,0,0.25); }
  body.light .proj-color-label { color: rgba(0,0,0,0.35); }
  body.light .proj-list-empty { color: rgba(0,0,0,0.25); }
  body.light .proj-color-row { border-color: rgba(0,0,0,0.06); }

  /* ── SEARCH OVERLAY ── */
  .search-overlay {
    position: fixed; inset: 0; z-index: 600;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: flex-start; justify-content: center;
    padding-top: 9vh;
    opacity: 0; pointer-events: none;
    transition: opacity 0.18s;
  }
  .search-overlay.open { opacity: 1; pointer-events: all; }
  .search-modal {
    width: 100%; max-width: 540px;
    background: #111827;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.7);
    transform: translateY(-10px) scale(0.98);
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  .search-overlay.open .search-modal { transform: none; }
  .search-input-row {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .search-input-row svg { width: 17px; height: 17px; color: rgba(255,255,255,0.35); flex-shrink: 0; }
  .search-input-row input {
    flex: 1; background: none; border: none; outline: none;
    color: #fff; font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem; font-weight: 400;
  }
  .search-input-row input::placeholder { color: rgba(255,255,255,0.3); }
  .search-close-btn {
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.35); font-size: 0.9rem;
    width: 26px; height: 26px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, color 0.12s; flex-shrink: 0;
  }
  .search-close-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .search-results {
    max-height: 340px; overflow-y: auto;
    padding: 0.4rem 0;
  }
  .search-result-item {
    display: flex; flex-direction: column; gap: 0.2rem;
    padding: 0.7rem 1rem;
    cursor: pointer;
    transition: background 0.12s;
    border-left: 2px solid transparent;
  }
  .search-result-item:hover {
    background: rgba(14,165,233,0.08);
    border-left-color: var(--accent);
  }
  .search-result-preview {
    font-size: 0.85rem; color: #dfe6f5; line-height: 1.35;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .search-result-date { font-size: 0.72rem; color: rgba(255,255,255,0.35); }
  .search-empty {
    padding: 1.5rem 1rem;
    text-align: center;
    font-size: 0.85rem; color: rgba(255,255,255,0.3);
    font-style: italic;
  }
  body.light .search-modal { background: #fff; border-color: rgba(0,0,0,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.15); }
  body.light .search-input-row { border-color: rgba(0,0,0,0.08); }
  body.light .search-input-row svg { color: rgba(0,0,0,0.35); }
  body.light .search-input-row input { color: #0d0d12; }
  body.light .search-input-row input::placeholder { color: rgba(0,0,0,0.3); }
  body.light .search-close-btn { color: rgba(0,0,0,0.35); }
  body.light .search-close-btn:hover { background: rgba(0,0,0,0.06); color: #000; }
  body.light .search-result-preview { color: #1a1a2a; }
  body.light .search-result-date { color: rgba(0,0,0,0.35); }
  body.light .search-result-item:hover { background: rgba(14,165,233,0.07); }
  body.light .search-empty { color: rgba(0,0,0,0.3); }

  /* ── VOICE BUTTON RECORDING STATE ── */
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.55); }
    50%       { box-shadow: 0 0 0 7px rgba(239,68,68,0); }
  }
  #voice-btn.recording {
    color: #f87171 !important;
    background: rgba(239,68,68,0.12);
    border-radius: 8px;
    animation: mic-pulse 1.1s ease-in-out infinite;
  }
  #voice-btn.recording svg { stroke: #f87171; }

  /* ── PARTICLES BACKGROUND ── */
  #particles-js {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  /* Lift all direct children of chat-main above the canvas */
  .chat-main > :not(#particles-js) { position: relative; z-index: 1; }
  /* FIX — account dropdown was unclickable: .chat-content is ALSO z-index:1 and
     comes AFTER .chat-header in the DOM, so it painted on top of the open account
     menu (transparently) and swallowed every click on the menu items. The avatar
     still worked because it sits inside the 60px header band that content doesn't
     cover. Lifting the header's stacking context above the content fixes it.
     !important is required: the rule above counts as ID-level specificity (the
     :not(#particles-js) carries an ID's weight), which a plain selector can't beat. */
  .chat-header { z-index: 20 !important; }

  /* ── ACCESSIBLE FOCUS RINGS ──
     Visible outline for keyboard / assistive-tech users only (not on every
     mouse click), so the terminal stays accessible without a stray outline. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  :focus:not(:focus-visible) { outline: none; }

  /* ── REDUCED MOTION ──
     Respect the OS "reduce motion" setting: finish animations/transitions
     near-instantly and disable smooth scrolling for those users. */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  /* ── SEND BUTTON: DISABLED WHILE STREAMING ──
     Greyed + not-clickable while a reply is generating so a user can't
     double-fire a second request mid-stream. */
  .prompt-send:disabled { opacity: 0.45; cursor: not-allowed; }
  .prompt-send:disabled:hover { background: #fff; }
  body.light .prompt-send:disabled:hover { background: #111; }

  /* ── RECENTS SKELETON (loading placeholder) ──
     Shown in the sidebar while chat history is being fetched, then replaced
     by the real recent-chat items. Shimmer = "loading", not "empty". */
  .recent-skeleton {
    display: flex; flex-direction: column; gap: 0.4rem;
    padding: 0.7rem 0.6rem;
    background: rgba(255,255,255,0.04);
    border-radius: 8px;
    border-left: 2px solid rgba(255,255,255,0.08);
  }
  .recent-skeleton .sk-line {
    height: 9px; border-radius: 4px;
    /* Moving light band across a dim base = classic shimmer skeleton */
    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.13) 37%, rgba(255,255,255,0.05) 63%);
    background-size: 400% 100%;
    animation: sk-shimmer 1.4s ease-in-out infinite;
  }
  .recent-skeleton .sk-line.short { width: 55%; }
  @keyframes sk-shimmer {
    0%   { background-position: 100% 0; }
    100% { background-position: 0 0; }
  }
  body.light .recent-skeleton { background: rgba(0,0,0,0.05); border-left-color: rgba(0,0,0,0.08); }
  body.light .recent-skeleton .sk-line {
    background: linear-gradient(90deg, rgba(0,0,0,0.05) 25%, rgba(0,0,0,0.11) 37%, rgba(0,0,0,0.05) 63%);
    background-size: 400% 100%;
  }

  /* ── ARTICLE CONTEXT CHIP ──
     Shown when the terminal is holding a blog post as background context, so
     "it already knows the article" is visible rather than magic. */
  .article-ctx-chip{
    display:flex;align-items:center;gap:.6rem;
    margin:0 auto 1rem;max-width:760px;
    padding:.55rem .8rem;border-radius:10px;font-size:.78rem;
    background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.26);
    color:rgba(235,240,255,.8);
  }
  .article-ctx-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .article-ctx-chip a{color:#7dd3fc}
  .article-ctx-chip span:nth-of-type(2){flex:1;min-width:0}
  .article-ctx-chip button{
    background:none;border:0;color:rgba(235,240,255,.55);cursor:pointer;
    font-size:.85rem;line-height:1;padding:.25rem;min-width:28px;min-height:28px;
  }
  .article-ctx-chip button:hover{color:#fff}
</style>

<!-- Config loaded as a global (window.CONFIG) before the main script -->
<script src="config.js"></script>
<script>
// ── MARKDOWN RENDERER ──
// Converts AI response markdown to safe HTML. Applied after stream ends,
// not during streaming (so partial tokens don't break mid-tag).
// renderMarkdown uses escapeHTML (defined below — function declarations are
// hoisted, so the definition order doesn't matter) instead of a second
// escaper: it was a near-duplicate that skipped quotes, which is harmless to
// also escape in text content.
function renderMarkdown(raw) {
  let t = raw;
  // Step 1: Extract fenced code blocks (```lang\ncode\n```) so inner content
  // isn't touched by bold/italic/link replacements
  const blocks = [];
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push(`<pre><code>${escapeHTML(code.trim())}</code></pre>`);
    return `\x00B${blocks.length - 1}\x00`; // placeholder
  });
  // Step 1b: SECURITY — escape ALL remaining text BEFORE any other transform.
  // The assistant reply can contain UNTRUSTED content (e.g. text pulled from
  // live RSS sources via RAG, which a poisoned feed could use to inject HTML).
  // Without this, raw HTML such as <img src=x onerror=...> would be written
  // straight into innerHTML further down and execute in the user's browser
  // (stored XSS). Escaping here turns every < > & into a harmless entity; the
  // markdown rules below only re-introduce the safe tags WE generate.
  // Fenced code blocks are already safe — escaped and swapped for \x00
  // placeholders in Step 1 — so this does not touch them.
  t = escapeHTML(t);
  // Step 2: Inline code (content is already escaped by Step 1b — just wrap it,
  // do NOT escape again or it would double-encode into &amp;lt; etc.)
  t = t.replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`);
  // Step 3: Bold+italic, bold, italic
  t = t.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  // Step 4: Links — only allow http/https to prevent javascript: injection.
  // SECURITY (H2): escapeHTML() above already escapes the quote in the URL too,
  // but percent-encoding it here is belt-and-suspenders — it guarantees the URL
  // can only ever be a URL, never new markup, even if Step 1b's escaping rules
  // change later. The link TEXT was already escaped in Step 1b.
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, (_, text, url) => {
    const safeUrl = url.replace(/"/g, '%22').replace(/'/g, '%27')
                       .replace(/</g, '%3C').replace(/>/g, '%3E');
    return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${text}</a>`;
  });
  // Step 5: Headers
  t = t.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  t = t.replace(/^## (.+)$/gm,  '<h2>$1</h2>');
  t = t.replace(/^# (.+)$/gm,   '<h1>$1</h1>');
  // Step 6: Horizontal rule
  t = t.replace(/^[-*]{3,}$/gm, '<hr>');
  // Step 7: Bullet and numbered list items
  t = t.replace(/^[*-] (.+)$/gm, '<li>$1</li>');
  t = t.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Step 8: Wrap consecutive <li> lines in a single <ul>
  t = t.replace(/((?:<li>.*\n?)+)/g, '<ul>$1</ul>');
  // Step 9: Paragraphs — blank lines separate blocks
  t = t.split(/\n{2,}/).map(chunk => {
    const c = chunk.trim();
    if (!c) return '';
    // Already an HTML block (or a code-block placeholder) — don't wrap in <p>
    if (/^(<(ul|ol|pre|h[1-6]|hr)|\x00B)/.test(c)) return c;
    return '<p>' + c.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');
  // Step 10: Restore code blocks
  blocks.forEach((b, i) => { t = t.replace(`\x00B${i}\x00`, b); });
  return t;
}

// ── SIDEBAR (desktop collapse + mobile drawer) ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('collapsed');
}
function openMobileSidebar() {
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebar-backdrop').classList.add('show');
}
function closeMobileSidebar() {

  document.getElementById('sidebar-backdrop').classList.remove('show');
