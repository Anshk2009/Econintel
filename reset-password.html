<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — EconIntel</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="manifest" href="manifest.json" />
<meta name="description" content="Reset your EconIntel account password." />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#05060c" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
<style>
  /* Same palette as index.html so the page feels like part of the site */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050508;
    --accent: #0ea5e9;
    --text: #f5f6fa;
    --text2: rgba(255,255,255,0.55);
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  /* Subtle blue glow in the corner — matches the landing page mood */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(circle at 20% 20%, rgba(14,165,233,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  .card {
    width: 100%; max-width: 400px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 2.25rem 2rem;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 1.05rem;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 1.75rem;
    display: inline-block;
    text-decoration: none;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 1.45rem;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }
  .sub { font-size: 0.875rem; color: var(--text2); margin-bottom: 1.75rem; line-height: 1.5; }

  label {
    display: block;
    font-size: 0.75rem; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 0.4rem;
  }
  input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
    color: var(--text);
    /* 16px stops iOS Safari from zooming into focused inputs */
    font-size: 16px;
    font-family: inherit;
    margin-bottom: 1.1rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    outline: none;
    border-color: rgba(14,165,233,0.5);
    box-shadow: 0 0 0 3px rgba(14,165,233,0.1);
  }
  input::placeholder { color: rgba(255,255,255,0.2); }

  button {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none; border-radius: 10px;
    padding: 0.8rem;
    font-family: inherit; font-size: 0.9rem; font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
    margin-top: 0.25rem;
  }
  button:hover { opacity: 0.85; transform: translateY(-1px); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* Status message under the button — red for errors, green for success */
  .status {
    font-size: 0.85rem;
    margin-top: 1rem;
    line-height: 1.5;
    display: none;
  }
  .status.error { display: block; color: #f87171; }
  .status.success { display: block; color: #34d399; }

  .back {
    display: inline-block;
    margin-top: 1.25rem;
    font-size: 0.85rem;
    color: var(--text2);
    text-decoration: none;
    transition: color 0.2s;
  }
  .back:hover { color: var(--text); }
</style>
<link rel="stylesheet" href="consent.css" />
</head>
<body>

<div class="card">
  <a class="logo" href="/index.html">EconIntel</a>
  <h1>Set a new password</h1>
  <p class="sub">Choose a new password for your account. Minimum 12 characters.</p>

  <form id="reset-form">
    <label for="new-password">New password</label>
    <input id="new-password" type="password" required minlength="12" maxlength="128"
           placeholder="••••••••••••" autocomplete="new-password" />

    <label for="confirm-password">Confirm password</label>
    <input id="confirm-password" type="password" required minlength="12" maxlength="128"
           placeholder="••••••••••••" autocomplete="new-password" />

    <button type="submit" id="submit-btn">Reset password</button>
  </form>

  <p class="status" id="status"></p>
  <a class="back" href="/index.html">← Back to home</a>
</div>

<!-- Config loaded as a global (window.CONFIG) before the main script -->
<script src="config.js"></script>
<script>
// The reset token arrives in the URL: /reset-password.html?token=abc123
// It was emailed to the user and is valid for 1 hour (enforced server-side).
const token = new URLSearchParams(window.location.search).get('token');

const form = document.getElementById('reset-form');
const statusEl = document.getElementById('status');
const submitBtn = document.getElementById('submit-btn');

function showStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + type;
}

// No token in the URL means the user landed here directly (not from the email
// link) — the form is useless without it, so disable it and explain.
if (!token) {
  form.style.display = 'none';
  showStatus('This link is invalid. Use the reset link from your email, or request a new one from the sign-in screen.', 'error');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const newPassword = document.getElementById('new-password').value;
  const confirm = document.getElementById('confirm-password').value;

  if (newPassword !== confirm) {
    showStatus('Passwords do not match.', 'error');
    return;
  }

  // Disable the button so double-clicks don't fire two requests —
  // the token is single-use, so a second request would fail confusingly
  submitBtn.disabled = true;
  submitBtn.textContent = 'Resetting…';

  try {
    // config.js only defines login/signup/logout URLs — derive verify-reset
    // from the login URL so dev/prod base paths stay consistent
    const url = CONFIG.auth.login.replace('action=login', 'action=verify-reset');
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include', // lets the server set the auth cookies on success
      body: JSON.stringify({ resetToken: token, newPassword }),
    });

    const data = await res.json();

    if (!res.ok) {
      // Most common case: token expired (1 hour) or already used
      showStatus(data.error || 'Reset failed. The link may have expired — request a new one.', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset password';
      return;
    }

    // Success — the server already set the auth cookies, so the user is now
    // logged in. Store the same localStorage state that login creates so
    // chat.html recognises the session, then send them to the terminal.
    try {
      localStorage.setItem('econintel:user', JSON.stringify({
        name:       data.username,
        email:      data.email,
        username:   data.username,
        plan:       data.plan || 'free',
        signedInAt: new Date().toISOString(),
      }));
      localStorage.setItem('econintel:csrf', data.csrfToken);
    } catch (_) {} // private mode — cookies still work, just no remembered UI state

    showStatus('Password updated. Taking you to the terminal…', 'success');
    form.style.display = 'none';
    setTimeout(() => { window.location.href = '/chat.html'; }, 1500);
  } catch (err) {
    showStatus('Network error. Check your connection and try again.', 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Reset password';
  }
});
</script>
<script src="consent.js" defer></script>
</body>
</html>
